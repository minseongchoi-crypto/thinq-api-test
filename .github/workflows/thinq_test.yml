name: ThinQ-Test

on:
  push:
    branches: [ "main" ]

jobs:
  run-newman:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout
      uses: actions/checkout@v4

    - name: 2. Check All Files In Repo
      run: |
        find . -maxdepth 3 -not -path '*/.*' -o -name "*.json" -o -name "*.yml"

    - name: 3. Install Node
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: 4. Install Newman
      run: npm install -g newman

    - name: 5. Debug ThinQ Response Body 🔍
      run: |
        echo "=== 실제 서버가 주는 응답 본문 확인 ==="
        curl -s -X GET "https://api-kic.lgthinq.com/devices" \
          -H "Authorization: Bearer ${{ secrets.THINQ_PAT }}" \
          -H "x-api-key: v6GFvkweNo7DK7yD3ylIZ9w52aKBU0eJ7wLXkSR3" \
          -H "x-client-id: gemini-postman-client-id" \
          -H "x-country: KR" \
          -H "x-service-phase: OP" \
          -H "x-message-id: 1234567890123456789012"

    - name: 6. Auto Detect & Run Newman 🚀
      run: |
        COLLECTION_FILE=$(find . -name "*collection.json" | head -n 1)
        newman run "$COLLECTION_FILE" \
          --env-var "thinq_url=https://api-kic.lgthinq.com" \
          --env-var "thinq_pat=${{ secrets.THINQ_PAT }}" \
          --env-var "my_device_id=3c3733939fcfe645b42519a480df51e7afeed78e6c7da3a498ec81d00cc692ae"
