name: ThinQ-Test

on:
  push:
    branches: [ "main" ]

jobs:
  run-newman:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout
      uses: actions/checkout@v4

    - name: 2. Check All Files In Repo
      run: |
        echo "=== 현재 저장소에 있는 모든 파일 목록 ==="
        find . -maxdepth 3 -not -path '*/.*' -o -name "*.json" -o -name "*.yml"

    - name: 3. Install Node
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: 4. Install Newman
      run: npm install -g newman

    - name: 5. Auto Detect & Run Newman 🚀
      run: |
        # .json으로 끝나는 컬렉션 파일을 자동으로 찾아서 실행!
        COLLECTION_FILE=$(find . -name "*collection.json" | head -n 1)
        echo "찾아낸 컬렉션 파일: $COLLECTION_FILE"

        if [ -z "$COLLECTION_FILE" ]; then
          echo "❌ 컬렉션 JSON 파일을 찾을 수 없습니다. 파일이 생성되었는지 확인하세요!"
          exit 1
        fi

        newman run "$COLLECTION_FILE" \
          --env-var "thinq_url=https://api-kic.lgthinq.com" \
          --env-var "thinq_pat=Bearer ${{ secrets.THINQ_PAT }}" \
          --env-var "my_device_id=3c3733939fcfe645b42519a480df51e7afeed78e6c7da3a498ec81d00cc692ae"
